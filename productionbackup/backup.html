<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Worklfow Production Backup</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        padding: 0;
        background: linear-gradient(135deg, #6a11cb, #2575fc);
        background-repeat: no-repeat;
        background-size: cover;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        color: #333;
        overflow: hidden;
      }
      .outer {
        height: 100%;
        width: 100%;
        padding-bottom: 50px;
        padding-top: 50px;
        overflow: auto;
        display: flex;
        justify-content: center;
        align-items: flex-start;
      }
      .form-container {
        background: #fff;
        border-radius: 15px;
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        padding: 30px;
        width: 85%;
        margin: 20px auto;
        animation: fadeIn 0.8s ease-in-out;
        display: none; /*Initially hidden*/
      }
      .print_date {
        display: none;
      }
      .form-container h2 {
        text-align: center;
        margin-bottom: 25px;
        color: #444;
        font-size: 24px;
        font-weight: bold;
      }
      .form-group {
        margin-bottom: 20px;
        width: 100%;
      }
      .form-group label {
        display: block;
        margin-bottom: 8px;
        font-size: 14px;
        font-weight: 600;
        color: #666;
      }
      .form-group select {
        width: 100%;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 14px;
        transition: all 0.3s;
      }
      .form-group input {
        width: -webkit-fill-available;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 14px;
        transition: all 0.3s;
      }
      .form-group select:focus,
      input:focus {
        border-color: #6a11cb;
        box-shadow: 0 0 8px rgba(106, 17, 203, 0.2);
        outline: none;
      }
      .submit-btn {
        width: 100%;
        padding: 12px;
        background: linear-gradient(135deg, #6a11cb, #2575fc);
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: bold;
        text-transform: uppercase;
        cursor: pointer;
        transition: background 0.3s;
      }
      .submit-btn:hover {
        background: linear-gradient(135deg, #2575fc, #6a11cb);
      }

      .login-container {
        background: #fff;
        border-radius: 15px;
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        padding: 30px;
        width: 450px;
        animation: fadeIn 0.8s ease-in-out;
        display: flex;
        flex-direction: column;
      }

      .login-container input {
        margin-bottom: 20px;
      }

      .tabs {
        display: flex;
        gap: 10px;
        justify-content: center;
        margin-bottom: 20px;
        font-size: 18px;
      }

      .tab {
        flex: 1;
        padding: 10px;
        text-align: center;
        cursor: pointer;
        border: 1px solid #ddd;
        border-radius: 8px;
        background-color: #f1f1f1;
        font-weight: bold;
        transition: background 0.3s;
      }

      .tab:hover {
        background-color: #ddd;
      }

      .tab.active {
        background-color: #6a11cb;
        color: white;
      }

      #journalFormContainer {
        display: none;
      }

      .data-table-container {
        margin-top: 30px;
        background: #fff;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
        width: 90%;
        display: none;
        margin: 20px auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
      }
      th, td {
        padding: 12px 15px;
        text-align: left;
        border: 1px solid #ddd;
      }
      th {
        background-color: #4CAF50;
        color: white;
        font-weight: bold;
      }
      tr:nth-child(even) {
        background-color: #f9f9f9;
      }
      tr:hover {
        background-color: #f1f1f1;
      }
      button {
        background-color: #ff4c4c;
        color: white;
        padding: 6px 12px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
      button:hover {
        background-color: #e03c3c;
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.5; /* Optional: Makes it visually look disabled */
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(-20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Style for loader overlay */
      .loader-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        display: none; /* Initially hidden */
        justify-content: center;
        align-items: center;
        z-index: 9999;
      }

      .loader {
        border: 8px solid #f3f3f3; /* Light gray */
        border-top: 8px solid #1815dd; /* Blue */
        border-radius: 50%;
        width: 60px;
        height: 60px;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        0% {
            transform: rotate(0deg);
        }
        100% {
            transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <!-- Loader Overlay -->
    <div id="loaderOverlay" class="loader-overlay">
      <div class="loader"></div>
    </div>
    <div class="outer">
    <!-- Login Form -->
    <div class="login-container">
      <h2>Login</h2>
      <form id="loginForm">
        <div class="form-group">
          <label for="username">Username:</label>
          <input type="text" id="username" name="username" required />
        </div>
        <div class="form-group">
          <label for="password">Password:</label>
          <input type="password" id="password" name="password" required />
        </div>
        <button type="submit" class="submit-btn">Login</button>
      </form>
    </div>

    <div>
      <!-- Tabs for "Delete Files" and "Backup Files" -->
      <div class="tabs" id="tabsContainer" style="display: none">
        <div class="tab active" id="backupTab" onclick="showForm('backup')">
          Backup Files
        </div>
        <div class="tab" id="deleteTab" onclick="showForm('delete')">
          Delete Files
        </div>
        <div class="tab" id="downloadTab" onclick="showForm('download')">
          Download Files
        </div>
        <div class="tab" id="restoreTab" onclick="showForm('restore')">
          Restore Files
        </div>
      </div>

      <div class="form-container" id="journalFormContainer">
        <h2 id="formTitle">Delete Files</h2>
        <form id="journalForm">
          <div class="form-group">
            <div class="select_date">
              <div style="display: flex; gap: 10px; justify-content: space-between;">
                <div style="width: 100%;">
                  <label for="date">From Date:</label>
                  <input type="text" id="from-date" name="from_date" placeholder="dd/mm/yyyy" />
                </div>
                <div style="width: 100%;">
                  <label for="date">To Date:</label>
                  <input type="text" id="to-date" name="to_date" placeholder="dd/mm/yyyy" />
                </div>
              </div>
            </div>
            <div class="print_date">
              <div>
                <div style="width: 100%; text-align: center;">
                  <label for="date">Current Date</label>
                  <p type="text" id="cur-date" name="from_date"></p>
                </div>
              </div>
            </div>
          </div>
          <div class="form-group">
            <label for="customerId">Customer ID:</label>
            <select id="customerId" name="customer_id">
              <option value="">Select Customer ID</option>
            </select>
          </div>
          <div class="form-group">
            <label for="journalName">Journal Code:</label>
            <select id="journalName" name="journal_id">
              <option value="">Select Journal Code</option>
            </select>
          </div>
          <p style="text-align: center;font-weight: bold;">( or )</p>
          <div class="form-group">
            <label for="articleId">Article ID:</label>
            <input type="text" id="articleId" name="article_id" placeholder="Enter article ID" />
          </div>
          <button type="submit" class="submit-btn">Delete</button>
        </form>
      </div>

      <!-- Data Table -->
      <div class="data-table-container" id="data-table">
        <h3>Data Table</h3>
        <table border="1" style="width: 100%; border-collapse: collapse;">
          <thead>
            <tr>
              <th>S.No</th>
              <th>Article_Name</th>
              <th>Customer Name</th>
              <th>Journal Name</th>
              <th>stage</th>
              <th>Sent Date</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody>
            
          </tbody>
        </table>
      </div>
    </div>

    <script>
      function formatDateTime(date) {
        const options = { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: true };
        const formattedDate = new Intl.DateTimeFormat('en-GB', options).format(date);
        
        const [datePart, timePart] = formattedDate.split(", ");
        return datePart.replace(/\//g, '-') + ' ' + timePart.toLowerCase();
      }

      let intervalId;
      let currentFormType = "backup"; // Default form type

      function deleteRow(button) {
        const row = button.parentElement.parentElement;
        row.remove();
      }

      // Initialize Flatpickr for the "From" date field
      const fromDate = flatpickr("#from-date", {
        dateFormat: "d/m/Y",
        altInput: true, // Display a custom input field
        altFormat: "d/m/Y", // Format for altInput
        allowInput: true, // Allow manual input of the date
        onChange: function(selectedDates) {
          // Update the "To" date picker to disable dates earlier than the selected "From" date
          toDate.set("minDate", selectedDates[0]); // Disable dates earlier than the selected "From" date
        },
      });

      // Initialize Flatpickr for the "To" date field
      const toDate = flatpickr("#to-date", {
        dateFormat: "d/m/Y", // Ensure dd/mm/yyyy format
        altInput: true, // Display a custom input field
        altFormat: "d/m/Y", // Format for altInput
        allowInput: true, // Allow manual input of the date
      });
      
      // Login functionality
      document.getElementById("loginForm").addEventListener("submit", function (e) {
        e.preventDefault(); // Prevent the form from submitting

        // Get the username and password values
        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;

        // Fetch the JSON file when the page loads
        fetch("users.json")
          .then(response => {
            if (!response.ok) {
              throw new Error("Failed to load credentials.");
            }
            return response.json();
          })
          .then(data => {
            // Check if the username and password match any in the credentials
            const user = data.find(
              cred => cred.username === username && cred.password === password
            );

            // Simple login check (replace with real authentication logic)
            if (user) {
              // Hide the login form and show the journal form
              document.querySelector(".login-container").style.display = "none";
              document.getElementById("tabsContainer").style.display = "flex";
              document.getElementById("data-table").style.display = "block";
              showForm("backup"); // Default to "Delete Files" form
            } else {
              alert("Invalid credentials. Please try again.");
            }
          })
          .catch(error => console.error("Error fetching credentials:", error));

          // // Simple login check (replace with real authentication logic)
          // if (username === "sysadmin" && password === "sysadmin@123") {
          //   // Hide the login form and show the journal form
          //   document.querySelector(".login-container").style.display = "none";
          //   document.getElementById("tabsContainer").style.display = "flex";
          //   document.getElementById("data-table").style.display = "block";
          //   showForm("backup"); // Default to "Delete Files" form
          // } else {
          //   alert("Invalid credentials. Please try again.");
          // }
      });

      function showForm(formType) {
        // Hide form content and reset tabs
        const formContainer = document.getElementById("formContainer");
        const formTitle = document.getElementById("formTitle");
        const form = document.getElementById("journalForm");
        const cur_date = document.getElementById("cur-date");

        const today = new Date();

        // Format date as dd/mm/yyyy
        const formattedDate = today.getDate().toString().padStart(2, '0') + "/" +
                              (today.getMonth() + 1).toString().padStart(2, '0') + "/" +
                              today.getFullYear();

        // Clear any previous content and reset
        form.reset();

        // Stop the interval on tab change
        if (intervalId) {
          clearInterval(intervalId);
          intervalId = null; // Reset intervalId
        }

        const tableBody = document.querySelector(".data-table-container tbody");
        // Clear previous rows (if needed)
        tableBody.innerHTML = "";

        // Change the form title based on the form type
        if (formType === "delete") {
          formTitle.textContent = "Delete Files";
          form.querySelector("button").textContent = "Delete"; // Change button text
          form.action = "http://117.232.75.163:8060/delete"; // Set the correct API endpoint for delete
        } else if (formType === "backup") {
          formTitle.textContent = "Backup Files";
          form.querySelector("button").textContent = "Backup"; // Change button text
          form.action = "http://117.232.75.163:8060/backup"; // Set the correct API endpoint for backup
        } else if (formType === "download") {
          formTitle.textContent = "Download Files";
          form.querySelector("button").textContent = "Download"; // Change button text
          form.action = "http://117.232.75.163:8060/download"; // Set the correct API endpoint for backup
        } else if (formType === "restore") {
          formTitle.textContent = "Restore Files";
          cur_date.textContent = formattedDate
          form.querySelector("button").textContent = "Restore"; // Change button text
          form.action = "http://117.232.75.163:8060/restore"; // Set the correct API endpoint for backup
        }

        // Reset the active tab
        document.getElementById("deleteTab").classList.remove("active");
        document.getElementById("backupTab").classList.remove("active");
        document.getElementById("downloadTab").classList.remove("active");
        document.getElementById("restoreTab").classList.remove("active");

        // Show the selected form and set the current form type
        currentFormType = formType;

        // Show the selected form
        if (formType === "delete") {
          document.getElementById("journalFormContainer").style.display = "block";
          document.querySelector(".print_date").style.display = "none";
          document.querySelector(".select_date").style.display = "block";
          document.getElementById("deleteTab").classList.add("active");
        } else if (formType === "backup") {
          document.getElementById("journalFormContainer").style.display = "block";
          document.querySelector(".print_date").style.display = "none";
          document.querySelector(".select_date").style.display = "block";
          document.getElementById("backupTab").classList.add("active");
        } else if (formType === "download") {
          document.getElementById("journalFormContainer").style.display = "block";
          document.querySelector(".print_date").style.display = "none";
          document.querySelector(".select_date").style.display = "block";
          document.getElementById("downloadTab").classList.add("active");
        } else if (formType === "restore") {
          document.getElementById("journalFormContainer").style.display = "block";
          document.querySelector(".select_date").style.display = "none";
          document.querySelector(".print_date").style.display = "block";
          document.getElementById("restoreTab").classList.add("active");
        }
      }
      // document.getElementById("tabsContainer").style.display = "flex";
      // showForm("backup"); // Default to "Delete Files" form

      document.addEventListener("DOMContentLoaded", async () => {
        const customerSelect = document.getElementById("customerId");
        const journalSelect = document.getElementById("journalName");

        // Function to populate customer dropdown
        async function loadCustomers() {

          const endpoint = "http://117.232.75.163:8060/get_customers" // API for delete form
          try {
            const response = await fetch(endpoint); // Fetch based on active form type
            if (response.ok) {
              const customers = await response.json(); // Assuming a JSON array of customers
              customers.forEach((customer) => {
                const option = document.createElement("option");
                option.value = customer.id; // Assuming `id` is the customer ID
                option.textContent = customer.c_name; // Assuming `name` is the customer name
                customerSelect.appendChild(option);
              });
            } else {
              console.error("Failed to fetch customers.");
            }
          } catch (error) {
            console.error("Error loading customers:", error.message);
          }
        }

        // Function to populate journal dropdown based on selected customer
        customerSelect.addEventListener("change", async () => {
          const customerId = customerSelect.value;
          journalSelect.innerHTML =
            '<option value="">Select Journal Name</option>'; // Reset journal dropdown

          if (!customerId) return; // Do nothing if no customer is selected

          try {
            const response = await fetch(
              `http://117.232.75.163:8060/get_journals?customer_id=${customerId}` // Endpoint to get journals
            );
            if (response.ok) {
              const journals = await response.json(); // Assuming a JSON array of journals
              journals.forEach((journal) => {
                const option = document.createElement("option");
                option.value = journal.id; // Assuming `id` is the journal ID
                option.textContent = journal.j_name; // Assuming `name` is the journal name
                journalSelect.appendChild(option);
              });
            } else {
              console.error("Failed to fetch journals.");
            }
          } catch (error) {
            console.error("Error loading journals:", error.message);
          }
        });
        loadCustomers();
      });

      document
        .getElementById("journalForm")
        .addEventListener("submit", async function (event) {
          event.preventDefault(); // Prevent the default form submission
          // Assuming `result.data` is an array of objects with the required fields
          const tableBody = document.querySelector(".data-table-container tbody");
          // Clear previous rows (if needed)
          tableBody.innerHTML = "";
          clearInterval(intervalId)

          // Collect form data
          const formData = new FormData(event.target);
          const data = Object.fromEntries(formData.entries());

          data.customer_id = data.customer_id || null;
          data.article_id = data.article_id || null;
          data.journal_id = data.journal_id || null; // Set to null if empty
          // console.log(typeof data.from_date)

          async function callApi() {
            try {
              let response;
              if (!data.article_id){
                response = await fetch(`${event.target.action}/get1`, {
                  method: "POST",
                  body: formData,
                });
              } else{
                const formData = new FormData();
                formData.append("article_id", data.article_id);
                response = await fetch(`${event.target.action}/article/get1`, {
                  method: "POST",
                  body: formData,
                });
              }

              if (response.ok) {
                const result = await response.json();
                // console.log("API Response:", result.id);

                // Assuming `result.data` is an array of objects with the required fields
                const tableBody = document.querySelector(".data-table-container tbody");
                
                // Clear previous rows (if needed)
                tableBody.innerHTML = "";
                  
                // Populate table rows
                result.list.forEach((item, index) => {
                  const row = document.createElement("tr");
                  // Create table cells
                  const serielCell = document.createElement("td");
                  serielCell.textContent = index + 1; // Replace with your actual key

                  const dateCell = document.createElement("td");
                  dateCell.textContent = item.article_id; // Replace with your actual key
                  
                  const customerIdCell = document.createElement("td");
                  customerIdCell.textContent = item.cust_name;
                  
                  const journalCodeCell = document.createElement("td");
                  journalCodeCell.textContent = item.journal_name;

                  const stageCell = document.createElement("td");
                  stageCell.textContent = item.stage;
				  
                  const sentdateCell = document.createElement("td");
                  const currentDate = new Date(item.sent_dt);
                  const formattedDateTime = formatDateTime(currentDate);                 
                  sentdateCell.textContent = formattedDateTime;				  
				  
                  // Append cells to the row
                  row.appendChild(serielCell);
                  row.appendChild(dateCell);
                  row.appendChild(customerIdCell);
                  row.appendChild(journalCodeCell);
                  row.appendChild(stageCell);
                  row.appendChild(sentdateCell);
                  
                  if (!event.target.action.includes("download")) {
                    const actionCell = document.createElement("td");
                    actionCell.textContent = item.result;
                    actionCell.style.fontWeight = "bold";
                    // Change text color based on the value of item.result
                    if (item.result === "Backedup") {
                        actionCell.style.color = "green";  // Set color to green for Success
                    } else if(item.result === "Deleted"){
                      actionCell.style.color = "red";
                    } else if(item.result === "Pending") {
                        actionCell.style.color = "#FF6A00";    // Set color to red for Failure
                    } else {
                        actionCell.style.color = "#F2A20D";   // Default color if no match
                    }
                    row.appendChild(actionCell);
                  } else{
                    const actionCell = document.createElement("td");
                    row.appendChild(actionCell);
                    const downloadButton = document.createElement("button");
                    downloadButton.textContent = "Download";

                    const loaderOverlay = document.getElementById("loaderOverlay");

                    // Add download logic
                    downloadButton.onclick = async function () {
						        if (downloadButton.disabled) return;
                      loaderOverlay.style.display = "flex";
                      downloadButton.disabled = true;
                      console.log("disabled")							  
                      const formData = new FormData();
                      formData.append("article_id", item.article_id);
                      formData.append("customer_name", item.cust_name);
                      formData.append("journal_name", item.journal_name);
                      formData.append("stage", item.stage);

                      try {
                        const response = await fetch("http://117.232.75.163:8060/download_file", {
                          method: "POST",
                          body: formData,
                        });

                        if (response.ok) {
                          const jsonResponse = await response.json();

                          // Extract the base64 content and filename from the response
                          const base64Content = jsonResponse.content;
                          const filename = jsonResponse.file_name;

                          // Decode and create a Blob from the base64 content
                          const byteCharacters = atob(base64Content);
                          const byteArrays = [];

                          for (let offset = 0; offset < byteCharacters.length; offset += 1024) {
                            const slice = byteCharacters.slice(offset, offset + 1024);
                            const byteNumbers = new Array(slice.length);
                            for (let i = 0; i < slice.length; i++) {
                              byteNumbers[i] = slice.charCodeAt(i);
                            }
                            byteArrays.push(new Uint8Array(byteNumbers));
                          }

                          const blob = new Blob(byteArrays, { type: "application/zip" }); // Adjust MIME type if needed
                          const url = window.URL.createObjectURL(blob);

                          // Create an anchor element and trigger the download
                          const a = document.createElement("a");
                          a.style.display = "none";
                          a.href = url;
                          a.download = filename;
                          document.body.appendChild(a);
                          a.click();

                          // Revoke the object URL to free memory
                          window.URL.revokeObjectURL(url);

                          console.log("File downloaded successfully");
                        } else {
                          console.error("Failed to download file");
                        }
                      } catch (error) {
                        console.error("Error occurred:", error);
                      } finally {
                        loaderOverlay.style.display = "none";
                        // Enable the button after the download process
                        downloadButton.disabled = false;
                      }
                    };
                    actionCell.appendChild(downloadButton);
                  }
                  
                  // Append row to the table body
                  tableBody.appendChild(row);
                    
                });

              } else {
                const errorResult = await response.json();
                console.error("Error Response:", errorResult);
                alert(errorResult.message);
              }
              
            } catch (error) {
              console.error("Error:", error.message);
              alert("Error: " + error.message);
            }
          }

          if (event.target.action.includes("download")) {
            callApi();
          } else if (event.target.action.includes("restore")) {
            
          } else{
            // Call the API every 5 minutes
            intervalId = setInterval(callApi, 1000); // 300,000 ms = 5 minutes
            callApi(); // Immediately call once before waiting for 5 minutes
          }

          if (!event.target.action.includes("download") && !data.article_id && !event.target.action.includes("restore")) {
            try {
              // Send POST request to the backend
              const response = await fetch(event.target.action, {
                method: "post",
                body: formData, // Directly send form data
              });
              // console.log(response)
              // Check if the response is OK
              if (response.ok) {
                const result = await response.json(); // Assuming backend returns JSON
                alert(result.message);
              } else {
                const result = await response.json();
                alert(result.message);
              }
            } catch (error) {
              alert("Error: " + error.message);
            }
